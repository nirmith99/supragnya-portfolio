<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supragnya — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --brown:      #8B5E2D;
      --brown-dark: #6B4520;
      --brown-deep: #4E3218;
      --cream:      #F5EDE0;
      --cream-dim:  rgba(245,237,224,0.52);
      --nav-h:      60px;
    }
    @media(min-width:768px){ :root{ --nav-h:72px; } }

    html { scroll-behavior:smooth; }
    body { font-family:'DM Sans',sans-serif; background:var(--brown); color:var(--cream); min-height:200vh; overflow-x:hidden; }
    body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:998; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); }

    /* ── NAV ── */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:200;
      height:var(--nav-h);
      padding:0 20px;
      display:flex; align-items:center; justify-content:space-between;
      transition:background .45s, backdrop-filter .45s, box-shadow .45s;
    }
    @media(min-width:768px){ nav{ padding:0 52px; } }
    nav.scrolled {
      background:rgba(78,50,24,.7);
      backdrop-filter:blur(22px) saturate(160%);
      -webkit-backdrop-filter:blur(22px) saturate(160%);
      box-shadow:0 1px 0 rgba(255,255,255,.07);
    }
    .nav-logo { font-family:'Playfair Display',serif; font-weight:700; font-size:1.1rem; color:var(--cream); text-decoration:none; z-index:201; }

    /* Desktop pill nav */
    .nav-links { display:none; align-items:center; gap:2px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.13); border-radius:999px; padding:6px 8px; }
    @media(min-width:768px){ .nav-links{ display:flex; } }
    .nav-links a { font-size:.7rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--cream); text-decoration:none; padding:7px 16px; border-radius:999px; transition:background .2s; white-space:nowrap; }
    .nav-links a:hover  { background:rgba(255,255,255,.11); }
    .nav-links a.active { background:rgba(255,255,255,.14); }
    .nav-divider { width:1px; height:16px; background:rgba(255,255,255,.16); margin:0 4px; }
    .nav-links a.contact-pill { background:var(--cream); color:var(--brown-dark); font-weight:600; }
    .nav-links a.contact-pill:hover { background:#ede0cb; }

    /* Hamburger */
    .hamburger { display:flex; flex-direction:column; justify-content:center; gap:5px; width:36px; height:36px; cursor:pointer; z-index:201; background:none; border:none; padding:4px; }
    @media(min-width:768px){ .hamburger{ display:none; } }
    .hamburger span { display:block; height:2px; border-radius:2px; background:var(--cream); transition:transform .35s ease, opacity .35s ease; transform-origin:center; }
    .hamburger span:nth-child(1) { width:22px; }
    .hamburger span:nth-child(2) { width:16px; }
    .hamburger span:nth-child(3) { width:22px; }
    .hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); width:22px; }
    .hamburger.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
    .hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); width:22px; }

    /* Mobile drawer */
    .mobile-menu { position:fixed; top:0; left:0; right:0; background:rgba(55,32,10,.97); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); z-index:199; padding:calc(var(--nav-h) + 20px) 24px 44px; display:flex; flex-direction:column; gap:4px; transform:translateY(-110%); transition:transform .4s cubic-bezier(.4,0,.2,1); border-bottom:1px solid rgba(255,255,255,.08); }
    .mobile-menu.open { transform:translateY(0); }
    @media(min-width:768px){ .mobile-menu{ display:none !important; } }
    .mobile-menu a { font-size:1.15rem; font-weight:500; color:var(--cream); text-decoration:none; padding:15px 0; border-bottom:1px solid rgba(255,255,255,.07); transition:opacity .2s; }
    .mobile-menu a:last-child { border:none; }
    .mobile-menu a:hover { opacity:.7; }
    .mobile-menu a.contact-mobile { margin-top:16px; display:inline-block; background:var(--cream); color:var(--brown-dark); font-weight:600; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; padding:14px 28px; border-radius:999px; border:none; }

    /* ── HERO ── */
    /* Mobile: full-height single column, vertically centered */
    .hero {
      min-height:100vh;
      display:flex; flex-direction:column;
      justify-content:center;
      padding:var(--nav-h) 24px 40px;
    }
    /* Desktop: two-column grid */
    @media(min-width:768px){
      .hero {
        display:grid; grid-template-columns:1fr 1fr;
        align-items:center;
        padding:0 40px;
        min-height:100vh;
      }
    }
    @media(min-width:1024px){ .hero{ padding:0 52px; } }

    /* LEFT — always left-aligned */
    .hero-left { display:flex; flex-direction:column; align-items:flex-start; animation:fadeUp 1s ease both; }
    @media(min-width:768px){ .hero-left{ padding:80px 0 40px; } }

    .hero-badge { display:inline-flex; align-items:center; gap:8px; font-size:.63rem; font-weight:500; letter-spacing:.13em; text-transform:uppercase; color:var(--cream); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:6px 14px; margin-bottom:22px; }
    @media(min-width:768px){ .hero-badge{ font-size:.67rem; margin-bottom:32px; } }
    .dot { width:7px; height:7px; border-radius:50%; background:#6BCB77; box-shadow:0 0 7px #6BCB77; animation:pulse 2.2s infinite; flex-shrink:0; }

    h1 { font-family:'Playfair Display',serif; font-weight:900; font-size:clamp(2.2rem,7vw,3.8rem); line-height:1.08; letter-spacing:-.02em; color:var(--cream); margin-bottom:18px; text-align:left; }
    @media(min-width:768px){ h1{ margin-bottom:24px; } }
    h1 em { font-style:italic; opacity:.62; }

    .hero-sub { font-size:clamp(.88rem,.95rem,1rem); font-weight:300; line-height:1.72; color:var(--cream-dim); margin-bottom:32px; max-width:440px; text-align:left; }
    @media(min-width:768px){ .hero-sub{ margin-bottom:44px; } }
    .hero-sub strong { color:var(--cream); font-weight:500; }

    /* Mobile: role badge shows below subtext instead of 3D */
    .mobile-role {
      display:inline-flex; align-items:center; gap:8px;
      margin-bottom:32px; padding:7px 16px; border-radius:999px;
      border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.2);
      font-family:'JetBrains Mono',monospace; font-size:.7rem;
    }
    @media(min-width:768px){ .mobile-role{ display:none; } }
    .mobile-role-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; transition:background .4s,box-shadow .4s; }
    .mobile-role-text { transition:opacity .35s,color .35s; }

    .hero-cta { display:inline-block; background:var(--cream); color:var(--brown-dark); font-size:.7rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; text-decoration:none; padding:14px 30px; border-radius:999px; transition:transform .25s,box-shadow .25s; }
    @media(min-width:768px){ .hero-cta{ padding:16px 38px; } }
    .hero-cta:hover { transform:translateY(-3px); box-shadow:0 16px 40px rgba(0,0,0,.3); }

    /* RIGHT — hidden on mobile, shown on desktop */
    .hero-right {
      display:none;
    }
    @media(min-width:768px){
      .hero-right {
        display:flex; flex-direction:column;
        align-items:center; justify-content:center;
        padding:80px 0 40px;
      }
    }
    @media(min-width:1024px){ .hero-right{ padding-right:0; } }

    #pencil-canvas { display:block; width:100%; height:clamp(360px,40vw,480px); max-width:420px; }
    @media(min-width:1024px){ #pencil-canvas{ height:520px; } }

    .desktop-role { display:inline-flex; align-items:center; gap:8px; margin-top:4px; padding:8px 20px; border-radius:999px; border:1px solid rgba(255,255,255,.15); background:rgba(0,0,0,.2); font-family:'JetBrains Mono',monospace; font-size:.75rem; }
    .desktop-role-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; transition:background .4s,box-shadow .4s; }
    .desktop-role-text { transition:opacity .35s,color .35s; }

    /* ── BELOW ── */
    .below-fold { min-height:100vh; display:flex; align-items:center; justify-content:flex-start; background:var(--brown-deep); padding:60px 24px; }
    @media(min-width:768px){ .below-fold{ padding:60px 52px; } }
    .below-fold p { font-family:'Playfair Display',serif; font-size:clamp(1.2rem,4vw,1.8rem); color:var(--cream); opacity:.18; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);} }
    @keyframes pulse  { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.78);} }
  </style>
</head>
<body>

<!-- NAV -->
<nav id="navbar">
  <a href="#" class="nav-logo">Supragnya</a>
  <div class="nav-links">
    <a href="#" class="active">Home</a>
    <a href="#">Projects</a>
    <a href="#">Testimonials</a>
    <div class="nav-divider"></div>
    <a href="#" class="contact-pill">Contact</a>
  </div>
  <button class="hamburger" id="hamburger" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="#" onclick="closeMenu()">Home</a>
  <a href="#" onclick="closeMenu()">Projects</a>
  <a href="#" onclick="closeMenu()">Testimonials</a>
  <a href="#" class="contact-mobile" onclick="closeMenu()">Contact</a>
</div>

<!-- HERO -->
<section class="hero">

  <div class="hero-left">
    <div class="hero-badge"><span class="dot"></span>Open to opportunities</div>
    <h1>The gap between<br/>design and shipping?<br/><em>I live there.</em></h1>
    <p class="hero-sub">Design sense, <strong>code understanding</strong>, and AI fluency — built to close the distance from idea to product.</p>

    <!-- Mobile only: role badge replaces 3D -->
    <div class="mobile-role">
      <span class="mobile-role-dot" id="mRoleDot"></span>
      <span class="mobile-role-text" id="mRoleText"></span>
    </div>

    <a href="#" class="hero-cta">View Selected Work</a>
  </div>

  <!-- Desktop only: 3D pencil -->
  <div class="hero-right">
    <canvas id="pencil-canvas"></canvas>
    <div class="desktop-role">
      <span class="desktop-role-dot" id="dRoleDot"></span>
      <span class="desktop-role-text" id="dRoleText"></span>
    </div>
  </div>

</section>

<div class="below-fold"><p>Projects coming soon.</p></div>

<!-- HAMBURGER -->
<script>
  const ham = document.getElementById('hamburger');
  const mob = document.getElementById('mobileMenu');
  let menuOpen = false;
  function closeMenu(){
    menuOpen=false; ham.classList.remove('open'); mob.classList.remove('open'); document.body.style.overflow='';
  }
  ham.addEventListener('click',()=>{
    menuOpen=!menuOpen; ham.classList.toggle('open',menuOpen); mob.classList.toggle('open',menuOpen);
    document.body.style.overflow=menuOpen?'hidden':'';
  });
</script>

<!-- THREE.JS (only initialised on desktop) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Roles shared between mobile badge and desktop 3D
const ROLES=[
  {symbol:'</>',  hex:'#7EB3FF', label:'knows enough to speak dev'},
  {symbol:'PM',   hex:'#FFD060', label:'thinks about why, not just how'},
  {symbol:'QA ✓', hex:'#6FEFAA', label:"asks 'what could break?' early"},
];
let rIdx=0;

// Mobile role badge
const mDot  = document.getElementById('mRoleDot');
const mText = document.getElementById('mRoleText');
mText.style.transition='opacity .35s,color .35s';

function applyMobileRole(idx){
  const r=ROLES[idx];
  mText.textContent=r.label; mText.style.color=r.hex;
  mDot.style.background=r.hex; mDot.style.boxShadow=`0 0 8px ${r.hex}`;
}
applyMobileRole(0);

// Desktop role badge
const dDot  = document.getElementById('dRoleDot');
const dText = document.getElementById('dRoleText');
dText.style.transition='opacity .35s,color .35s';

function applyDesktopRole(idx){
  const r=ROLES[idx];
  dText.textContent=r.label; dText.style.color=r.hex;
  dDot.style.background=r.hex; dDot.style.boxShadow=`0 0 8px ${r.hex}`;
}
applyDesktopRole(0);

function cycleRoles(){
  mText.style.opacity='0'; dText.style.opacity='0';
  setTimeout(()=>{
    rIdx=(rIdx+1)%ROLES.length;
    applyMobileRole(rIdx); applyDesktopRole(rIdx);
    mText.style.opacity='1'; dText.style.opacity='1';
    if(typeof drawSymbol==='function') drawSymbol(ROLES[rIdx].symbol, ROLES[rIdx].hex);
  },360);
}
setInterval(cycleRoles,2600);

// ── THREE.JS — only init if desktop ──
const isDesktop = () => window.innerWidth >= 768;
let threeReady = false;

function initThree(){
  if(threeReady) return;
  threeReady = true;

  const canvas=document.getElementById('pencil-canvas');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(34,1,.1,100);
  camera.position.set(0,0,10); camera.lookAt(0,0,0);

  function mk(geo,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){
    const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); return m;
  }

  const mBody =new THREE.MeshStandardMaterial({color:0xF2C230,roughness:.28,metalness:.04});
  const mFaceB=new THREE.MeshStandardMaterial({color:0xF9D96A,roughness:.28,metalness:.04});
  const mWood =new THREE.MeshStandardMaterial({color:0xC4885A,roughness:.72});
  const mLead =new THREE.MeshStandardMaterial({color:0x1A1A1A,roughness:.92});
  const mBand =new THREE.MeshStandardMaterial({color:0xA0855A,roughness:.22,metalness:.7});
  const mErase=new THREE.MeshStandardMaterial({color:0xF09898,roughness:.6});

  const pencil=new THREE.Group();
  const SEG=6;
  const LEAD_H=.22,WOOD_H=.55,BODY_H=2.6,BAND_H=.12,ERASE_H=.26;
  const leadTop=LEAD_H, woodBot=leadTop, woodTop=woodBot+WOOD_H;
  const bodyBot=woodTop, bodyTop=bodyBot+BODY_H;
  const bandBot=bodyTop, bandTop=bandBot+BAND_H;
  const eraseBot=bandTop, eraseTop=eraseBot+ERASE_H;

  const lm=new THREE.Mesh(new THREE.ConeGeometry(.038,LEAD_H,12),mLead);
  lm.rotation.x=Math.PI; lm.position.y=leadTop-LEAD_H/2; pencil.add(lm);
  pencil.add(mk(new THREE.CylinderGeometry(.18,.038,WOOD_H,SEG),mWood,0,woodBot+WOOD_H/2));
  pencil.add(mk(new THREE.CylinderGeometry(.18,.18,BODY_H,SEG),mBody,0,bodyBot+BODY_H/2));
  for(let i=0;i<SEG;i+=2)
    pencil.add(mk(new THREE.CylinderGeometry(.182,.182,BODY_H,SEG,1,true,(i/SEG)*Math.PI*2,Math.PI*2/SEG),mFaceB,0,bodyBot+BODY_H/2));
  pencil.add(mk(new THREE.CylinderGeometry(.192,.192,BAND_H,SEG),mBand,0,bandBot+BAND_H/2));
  pencil.add(mk(new THREE.CylinderGeometry(.168,.168,ERASE_H,SEG),mErase,0,eraseBot+ERASE_H/2));
  pencil.add(mk(new THREE.CylinderGeometry(.168,.168,.012,SEG),new THREE.MeshStandardMaterial({color:0xE08888,roughness:.5}),0,eraseTop+.006));

  const pencilCenter=eraseTop/2;
  pencil.position.y=-pencilCenter-0.6;
  pencil.rotation.z=0.18; pencil.rotation.x=-0.10;
  scene.add(pencil);

  // Hat
  const hatGroup=new THREE.Group(); scene.add(hatGroup);
  const hM=new THREE.MeshStandardMaterial({color:0x4A2E0A,roughness:.78,metalness:.04});
  const hM2=new THREE.MeshStandardMaterial({color:0x2E1A04,roughness:.85});
  const hB=new THREE.MeshStandardMaterial({color:0x7A5020,roughness:.55});
  hatGroup.add(mk(new THREE.CylinderGeometry(.46,.44,.08,24),hM,0,.04));
  hatGroup.add(mk(new THREE.CylinderGeometry(.32,.42,.26,16),hM,0,.21));
  hatGroup.add(mk(new THREE.CylinderGeometry(.20,.32,.32,12),hM,.05,.49));
  hatGroup.add(mk(new THREE.CylinderGeometry(.11,.20,.30,10),hM,.08,.74));
  const tc=new THREE.Mesh(new THREE.ConeGeometry(.11,.44,10),hM);
  tc.position.set(.12,.96,0); tc.rotation.z=-0.40; hatGroup.add(tc);
  hatGroup.add(mk(new THREE.TorusGeometry(.43,.022,8,32),hB,0,.075,0,Math.PI/2));
  hatGroup.add(mk(new THREE.TorusGeometry(.23,.016,6,20,Math.PI),hM2,.02,.20,.24,Math.PI*.48,0,0));

  const symCvs=document.createElement('canvas'); symCvs.width=symCvs.height=256;
  const symCtx=symCvs.getContext('2d');
  const symTex=new THREE.CanvasTexture(symCvs);
  const symMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(.52,.52),
    new THREE.MeshBasicMaterial({map:symTex,transparent:true,depthTest:false,depthWrite:false,side:THREE.DoubleSide})
  );
  symMesh.position.set(.06,.20,.35); hatGroup.add(symMesh);

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  window.drawSymbol = function(text,color){
    symCtx.clearRect(0,0,256,256);
    symCtx.fillStyle='rgba(0,0,0,0.78)';
    roundRect(symCtx,38,92,180,72,18); symCtx.fill();
    symCtx.strokeStyle=color; symCtx.lineWidth=4;
    roundRect(symCtx,38,92,180,72,18); symCtx.stroke();
    symCtx.font='bold 64px "JetBrains Mono",monospace';
    symCtx.fillStyle='#fff'; symCtx.textAlign='center'; symCtx.textBaseline='middle';
    symCtx.shadowColor=color; symCtx.shadowBlur=14;
    symCtx.fillText(text,128,128); symTex.needsUpdate=true;
  };
  window.drawSymbol(ROLES[0].symbol, ROLES[0].hex);

  scene.add(new THREE.AmbientLight(0xF5EDE0,.7));
  const key=new THREE.DirectionalLight(0xFFFAF0,2.4); key.position.set(4,8,6); scene.add(key);
  const fill=new THREE.DirectionalLight(0xC8903A,.9); fill.position.set(-5,2,-2); scene.add(fill);
  const rim=new THREE.DirectionalLight(0xFFEED0,1.0); rim.position.set(0,-5,-4); scene.add(rim);
  const front=new THREE.DirectionalLight(0xFFFFFF,1.6); front.position.set(0,1,10); scene.add(front);

  function onResize(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    if(!w||!h) return;
    renderer.setSize(w,h,false);
    camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',onResize);
  setTimeout(onResize,100);

  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{ mx=(e.clientX/innerWidth-.5)*2; my=(e.clientY/innerHeight-.5)*2; });

  const clock=new THREE.Clock();
  const ewp=new THREE.Vector3();
  (function loop(){
    requestAnimationFrame(loop);
    const t=clock.getElapsedTime();
    pencil.rotation.y=t*.30;
    pencil.position.y=-pencilCenter-0.6+Math.sin(t*.8)*.10;
    pencil.rotation.x=-0.10+my*.04;
    pencil.rotation.z=0.18+mx*.04;
    pencil.localToWorld(ewp.set(0,eraseTop+.06,0));
    hatGroup.position.copy(ewp);
    hatGroup.rotation.x=-0.08+my*.025;
    hatGroup.rotation.z=0.10+mx*.025;
    renderer.render(scene,camera);
  })();
}

// Only boot Three.js on desktop — saves mobile load time
if(isDesktop()) initThree();
window.addEventListener('resize',()=>{ if(isDesktop()) initThree(); });

// Sticky nav
const nav=document.getElementById('navbar');
window.addEventListener('scroll',()=>{ nav.classList.toggle('scrolled',scrollY>40); });
</script>
</body>
</html>
